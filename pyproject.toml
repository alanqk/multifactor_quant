[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mf"
version = "0.1.0"
description = "US multifactor quant research system (momentum / value / quality / low-vol)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
